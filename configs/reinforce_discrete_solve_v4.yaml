experiment_name: reinforce_discrete_solve_v4
agent: reinforce
env:
  id: MountainCar-v0
  wrappers:
    progress_goal_reward:
      progress_weight: 8.0
      goal_bonus: 200.0
    record_episode_stats: true
train:
  episodes: 300
  max_steps_per_episode: 200
  eval_every: 20
  eval_episodes: 30
  seeds: [7]
  save_every: 60
reinforce:
  learning_rate: 0.0003
  gamma: 0.99
  entropy_coef: 0.01
  value_fn_coef: 0.5
  hidden_sizes: [128, 128]
  batch_episodes: 8
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures