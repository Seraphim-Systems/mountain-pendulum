experiment_name: reinforce_discrete_solve
agent: reinforce
env:
  id: MountainCar-v0
  wrappers:
    augment_state: true
    energy_shaping:
      energy_weight: 0.6
    record_episode_stats: true
train:
  episodes: 700
  max_steps_per_episode: 200
  eval_every: 25
  eval_episodes: 20
  seeds: [7]
  save_every: 100
reinforce:
  learning_rate: 0.001
  gamma: 0.99
  entropy_coef: 0.02
  value_fn_coef: 0.0
  hidden_sizes: [256, 256]
  batch_episodes: 12
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures