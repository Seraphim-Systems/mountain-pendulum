experiment_name: reinforce_fuel
agent: reinforce
env:
  id: MountainCar-v0
  wrappers:
    augment_state: true
    fuel_cost: true
    energy_shaping:
      energy_weight: 0.6
    record_episode_stats: true
train:
  episodes: 100
  max_steps_per_episode: 200
  eval_every: 20
  eval_episodes: 10
  seeds: [7, 21]
  save_every: 50
reinforce:
  learning_rate: 0.0005
  gamma: 0.99
  entropy_coef: 0.01
  value_fn_coef: 0.5
  hidden_sizes: [128, 128]
  batch_episodes: 4
  # Behaviour-clone the discrete (Categorical) policy from the strong
  # MountainCar-v0 DQN teacher trained without fuel cost. The teacher's
  # action space is Discrete(3), matching the student's; obs space is
  # the augmented (4,) representation (same as student here).
  teacher_checkpoint: outputs/models/dqn_discrete_solve_seed7_final.zip
  teacher_pretrain_episodes: 80
  teacher_env:
    id: MountainCar-v0
    wrappers:
      augment_state: true
      energy_shaping:
        energy_weight: 0.6
      record_episode_stats: true
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
