experiment_name: reinforce_discrete
agent: reinforce
env:
  id: MountainCar-v0
  wrappers:
    augment_state: true
    record_episode_stats: true
train:
  episodes: 400
  max_steps_per_episode: 200
  eval_every: 40
  eval_episodes: 20
  seeds: [7, 21, 42]
  save_every: 50
reinforce:
  learning_rate: 0.0005
  gamma: 0.99
  entropy_coef: 0.01
  value_fn_coef: 0.5
  hidden_sizes: [128, 128]
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
