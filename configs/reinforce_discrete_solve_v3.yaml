experiment_name: reinforce_discrete_solve_v3
agent: reinforce
env:
  id: MountainCar-v0
  wrappers:
    energy_shaping:
      energy_weight: 1.0
    record_episode_stats: true
train:
  episodes: 450
  max_steps_per_episode: 200
  eval_every: 25
  eval_episodes: 30
  seeds: [7]
  save_every: 75
reinforce:
  learning_rate: 0.0003
  gamma: 0.995
  entropy_coef: 0.005
  value_fn_coef: 0.5
  hidden_sizes: [128, 128]
  batch_episodes: 8
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures