experiment_name: reinforce_minsteps
agent: reinforce
env:
  id: MountainCarContinuous-v0
  wrappers:
    step_cost: true
    # See reinforce_continuous.yaml: weight 5.0 made REINFORCE overfit the
    # velocity-bonus local optimum. 0.5 keeps the +100 goal bonus dominant.
    energy_shaping:
      energy_weight: 0.5
    record_episode_stats: true
train:
  episodes: 80
  max_steps_per_episode: 999
  eval_every: 20
  eval_episodes: 5
  seeds: [7, 21]
  save_every: 40
reinforce:
  learning_rate: 0.0003
  gamma: 0.99
  entropy_coef: 0.0
  value_fn_coef: 0.5
  hidden_sizes: [128, 128]
  batch_episodes: 2
  # Behaviour-clone the continuous Gaussian policy from the discrete-action
  # DQN teacher trained on the same step-cost reward variant. Teacher's
  # DiscretizeActionWrapper supplies the action table that turns its integer
  # output into the continuous force the Gaussian student imitates.
  teacher_checkpoint: outputs/models/dqn_minsteps_seed7_final.zip
  teacher_pretrain_episodes: 40
  teacher_env:
    id: MountainCarContinuous-v0
    wrappers:
      step_cost: true
      energy_shaping:
        energy_weight: 5.0
      discretize_action:
        n_actions: 3
      record_episode_stats: true
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
