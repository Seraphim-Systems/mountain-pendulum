experiment_name: reinforce_discrete_quick
agent: reinforce
env:
  id: MountainCar-v0
  wrappers:
    augment_state: true
    record_episode_stats: true
train:
  episodes: 120
  max_steps_per_episode: 200
  eval_every: 20
  eval_episodes: 10
  seeds: [7]
  save_every: 40
reinforce:
  learning_rate: 0.0005
  gamma: 0.99
  entropy_coef: 0.01
  value_fn_coef: 0.0
  hidden_sizes: [128, 128]
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
