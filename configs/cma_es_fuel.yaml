experiment_name: cma_es_fuel
agent: cma_es
env:
  id: MountainCar-v0
  wrappers:
    augment_state: true
    fuel_cost: true
    energy_shaping:
      energy_weight: 20.0
    record_episode_stats: true
train:
  episodes: 200
  max_steps_per_episode: 200
  eval_every: 20
  eval_episodes: 10
  seeds: [7, 21, 42]
  save_every: 50
cma_es:
  population_size: 50
  sigma0: 1.5
  hidden_sizes: [64, 64]
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
