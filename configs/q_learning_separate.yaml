experiment_name: q_learning_discrete_separate
algorithm: q_learning
env:
  id: MountainCar-v0
  wrappers:
    discretize_state:
      n_bins: 24
    record_episode_stats: true
train:
  episodes: 2000
  max_steps_per_episode: 200
  eval_every: 100
  eval_episodes: 20
  seeds: [7, 21, 42]
q_learning:
  learning_rate: 0.1
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.02
  epsilon_decay: 0.995
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
