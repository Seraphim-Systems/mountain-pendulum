experiment_name: neat_minsteps
agent: neat
env:
  id: MountainCarContinuous-v0
  wrappers:
    step_cost: true
    energy_shaping:
      energy_weight: 10.0
    record_episode_stats: true
train:
  episodes: 200
  max_steps_per_episode: 999
  eval_every: 20
  eval_episodes: 10
  seeds: [7, 21, 42]
  save_every: 50
neat:
  pop_size: 50
  fitness_threshold: 90.0
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
