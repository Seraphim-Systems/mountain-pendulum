experiment_name: dqn_discrete
agent: dqn
env:
  id: MountainCar-v0
  wrappers:
    augment_state: true
    record_episode_stats: true
train:
  episodes: 600
  max_steps_per_episode: 200
  eval_every: 50
  eval_episodes: 20
  seeds: [7, 21, 42]
  save_every: 100
dqn:
  learning_rate: 0.0005
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  batch_size: 64
  replay_buffer_size: 50000
  min_buffer_size: 1000
  target_update_freq: 200
  hidden_sizes: [128, 128]
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
