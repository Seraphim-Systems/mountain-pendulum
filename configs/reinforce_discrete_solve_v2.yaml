experiment_name: reinforce_discrete_solve_v2
agent: reinforce
env:
  id: MountainCar-v0
  wrappers:
    energy_shaping:
      energy_weight: 1.2
    record_episode_stats: true
train:
  episodes: 1000
  max_steps_per_episode: 200
  eval_every: 50
  eval_episodes: 30
  seeds: [7]
  save_every: 200
reinforce:
  learning_rate: 0.001
  gamma: 0.995
  entropy_coef: 0.0
  value_fn_coef: 0.5
  hidden_sizes: [128, 128]
  batch_episodes: 16
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures