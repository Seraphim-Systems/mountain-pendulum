experiment_name: sarsa_discrete_tuned
algorithm: sarsa
env:
  id: MountainCar-v0
  wrappers:
    discretize_state:
      n_bins: 32
    record_episode_stats: true
train:
  episodes: 5000
  max_steps_per_episode: 200
  eval_every: 100
  eval_episodes: 30
  seeds: [7, 21, 42, 84, 126]
sarsa:
  learning_rate: 0.05
  gamma: 0.995
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.998
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
