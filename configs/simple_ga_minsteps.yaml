experiment_name: simple_ga_minsteps
agent: simple_ga
env:
  id: MountainCarContinuous-v0
  wrappers:
    step_cost: true
    record_episode_stats: true
train:
  episodes: 200
  max_steps_per_episode: 999
  eval_every: 20
  eval_episodes: 10
  seeds: [7, 21, 42]
  save_every: 50
simple_ga:
  population_size: 50
  elite_frac: 0.2
  mutation_std: 0.1
  crossover_alpha: 0.5
  hidden_sizes: [64, 64]
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
