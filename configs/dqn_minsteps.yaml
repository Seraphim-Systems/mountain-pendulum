experiment_name: dqn_minsteps
agent: dqn
env:
  id: MountainCarContinuous-v0
  wrappers:
    step_cost: true
    energy_shaping:
      energy_weight: 5.0
    discretize_action:
      n_actions: 3
    record_episode_stats: true
train:
  episodes: 300
  max_steps_per_episode: 999
  eval_every: 25
  eval_episodes: 10
  seeds: [7, 21]
  save_every: 50
dqn:
  n_envs: 4
  learning_rate: 0.0005
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.02
  epsilon_decay: 0.995
  exploration_fraction: 0.25
  batch_size: 64
  replay_buffer_size: 100000
  min_buffer_size: 2000
  target_update_freq: 500
  hidden_sizes: [256, 256]
paths:
  logs_dir: outputs/logs
  models_dir: outputs/models
  figures_dir: outputs/figures
